name: Feature request
description: Suggest something this repository should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The job you want to get done, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you'd like it to work. An example call or workflow helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you use today
      description: Workarounds or other tools you've tried.
